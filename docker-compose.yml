services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      # 密码无默认值：未在 .env 设置 POSTGRES_PASSWORD 时 compose 直接报错
      POSTGRES_USER: ${POSTGRES_USER:-butler}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD 未设置（请写入 .env）}
      POSTGRES_DB: ${POSTGRES_DB:-butler}
    ports:
      # 仅绑定本机回环，不暴露到局域网
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-butler} -d ${POSTGRES_DB:-butler}"]
      interval: 2s
      timeout: 2s
      retries: 15
    restart: unless-stopped

  api:
    build: .
    command: uv run --no-dev uvicorn app.main:app --host 0.0.0.0 --port 8000
    env_file:
      - path: .env
        required: false
    environment:
      # compose 网络内用 db 主机名覆盖宿主机地址
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-butler}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD 未设置（请写入 .env）}@db:5432/${POSTGRES_DB:-butler}
    ports:
      # 绑回环：WSL(wslhost) 只转发绑 127.0.0.1 的端口到 Windows localhost，且不暴露局域网
      - "127.0.0.1:8000:8000"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  worker:
    build: .
    command: uv run --no-dev python -m app.worker.runner
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-butler}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD 未设置（请写入 .env）}@db:5432/${POSTGRES_DB:-butler}
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  feishu:
    # 飞书长连接独立服务；SDK 事件循环是模块级全局，只能单实例部署
    build: .
    command: uv run --no-dev python -m app.feishu_main
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-butler}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD 未设置（请写入 .env）}@db:5432/${POSTGRES_DB:-butler}
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  adminer:
    # 数据库网页看板（本机访问）：http://localhost:8080
    image: adminer:4
    environment:
      ADMINER_DEFAULT_SERVER: db
      ADMINER_DESIGN: pepa-linha
    ports:
      # 0.0.0.0 让 Windows 侧能通过 WSL IP 访问；WSL 内部 NAT 实际只有本机可达
      - "0.0.0.0:8080:8080"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

volumes:
  pgdata:
