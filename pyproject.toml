[project]
name = "butler"
version = "0.1.0"
description = "AI-native time management & companion backend (P0)"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy[asyncio]>=2.0.30",
    "alembic>=1.13",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "httpx>=0.27",
    "psycopg[binary]>=3.2",
    "pgvector>=0.3",
    "pyyaml>=6.0",
    "lark-oapi>=1.4",
]

[dependency-groups]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "ruff>=0.5",
    "mypy>=1.10",
    "types-pyyaml>=6.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
pythonpath = ["."]
markers = [
    "requires_embedding: 需要真实 Ollama 嵌入服务（设置 REQUIRE_EMBEDDING=1 后才运行）",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
# 中文 docstring 的行宽按字符数偏长，放宽行长度限制
ignore = ["E501"]

[tool.mypy]
python_version = "3.12"
strict = true
# P0 允许裸 dict/list 泛型标注（JSONB payload 场景众多），其余 strict 全保留
disallow_any_generics = false
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = "app.db.migrations.*"
ignore_errors = true

[[tool.mypy.overrides]]
# 飞书官方 SDK 未提供类型标注
module = "lark_oapi.*"
ignore_missing_imports = true
